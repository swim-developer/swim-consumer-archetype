#set( $dollar = '$' )
# =============================================================================
# SWIM ${serviceDisplayName} Consumer - Production Profile
# =============================================================================

quarkus.mongodb.connection-string=${dollar}{MONGODB_URI:mongodb://localhost:27017}

swim.providers=${dollar}{SWIM_PROVIDERS}

${serviceName}.subscriptions=${dollar}{SUBSCRIPTIONS:[]}

kafka.bootstrap.servers=${dollar}{KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

swim.leader-election.mode=lease
swim.leader-election.lease-name=${artifactId}-leader
swim.leader-election.lease-duration-seconds=15
swim.leader-election.renew-deadline-seconds=10
swim.leader-election.retry-period-seconds=2

quarkus.log.category."com.github.swim_developer".level=INFO
