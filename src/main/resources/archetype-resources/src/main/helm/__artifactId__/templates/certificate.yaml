{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.appName }}-mtls-cert
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "${artifactId}.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.appName }}-mtls
  issuerRef:
    name: {{ .Values.certManager.issuerName }}
    kind: {{ .Values.certManager.issuerKind }}
  commonName: {{ .Values.appName }}
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  dnsNames:
    - {{ .Values.appName }}
    - {{ .Values.appName }}.{{ .Values.namespace }}
    - {{ .Values.appName }}.{{ .Values.namespace }}.svc
    - {{ .Values.appName }}.{{ .Values.namespace }}.svc.cluster.local
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: {{ .Values.appName }}-mtls-password
        key: password
    jks:
      create: true
      passwordSecretRef:
        name: {{ .Values.appName }}-mtls-password
        key: password
{{- end }}
